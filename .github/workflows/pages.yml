   name: Deploy dashboard to Pages

   on:
     push:
       branches: [main]
       paths: ['dashboard/**', '.github/workflows/pages.yml']
     workflow_dispatch:

   permissions:
     contents: read
     pages: write
     id-token: write

   concurrency:
     group: pages
     cancel-in-progress: true

   jobs:
     deploy:
       environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/configure-pages@v5

         - name: Remove backup folders before publishing
           run: rm -rf dashboard/.backup_*

         - uses: actions/upload-pages-artifact@v3
           with:
             path: dashboard

         - id: deployment
           uses: actions/deploy-pages@v4
